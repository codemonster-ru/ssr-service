name: Release

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: '24.19.0'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Verify release tag
              if: github.event_name == 'push' && github.ref_type == 'tag'
              run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Extract changelog entry
              run: |
                  RAW_VERSION=${GITHUB_REF_NAME#v}

                  if [[ "$RAW_VERSION" == *"-test" ]]; then
                    VERSION=${RAW_VERSION%-test}
                  else
                    VERSION=$RAW_VERSION
                  fi

                  echo "Looking for version: $VERSION (from tag $RAW_VERSION)"

                  awk "/^## \\[$VERSION\\]/ {flag=1; next} /^## \\[/ {flag=0} flag {print}" CHANGELOG.md > RELEASE_NOTES.md

                  if [ ! -s RELEASE_NOTES.md ]; then
                    echo "⚠️ No changelog entry found, using default message"
                    echo "Release $RAW_VERSION" > RELEASE_NOTES.md
                  fi

                  echo "---- RELEASE NOTES ----"
                  cat RELEASE_NOTES.md

            - name: Publish to npm
              if: github.event_name == 'push' && github.ref_type == 'tag'
              run: npm publish --access public --tag latest --provenance

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
