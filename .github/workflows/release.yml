name: Release

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '24.19.0'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Verify release tag
              run: |
                  version=$(node -p 'require("./package.json").version')
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "::error::The release tag must match the package version v$version."
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
                      echo "::error::The release tag must point to a commit merged into main."
                      exit 1
                  fi

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Extract changelog entry
              run: |
                  RAW_VERSION=${GITHUB_REF_NAME#v}

                  if [[ "$RAW_VERSION" == *"-test" ]]; then
                    VERSION=${RAW_VERSION%-test}
                  else
                    VERSION=$RAW_VERSION
                  fi

                  echo "Looking for version: $VERSION (from tag $RAW_VERSION)"

                  awk "/^## \\[$VERSION\\]/ {flag=1; next} /^## \\[/ {flag=0} flag {print}" CHANGELOG.md > RELEASE_NOTES.md

                  if [ ! -s RELEASE_NOTES.md ]; then
                    echo "⚠️ No changelog entry found, using default message"
                    echo "Release $RAW_VERSION" > RELEASE_NOTES.md
                  fi

                  echo "---- RELEASE NOTES ----"
                  cat RELEASE_NOTES.md

            - name: Publish to npm
              run: npm publish --access public --tag latest --provenance

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
